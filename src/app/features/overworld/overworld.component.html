<div class="overworld-screen">
  <div class="overworld-header">
    <span class="title">⚔️  MORDOR — OVERWORLD</span>
    <span class="coords" *ngIf="state">
      {{ state.playerX }}, {{ state.playerY }}
    </span>
  </div>

  <app-overworld-3d-view
    *ngIf="viewport()"
    [cells]="viewport()!.cells"
    [inShip]="inShip()"
    [direction]="direction()"
    [character]="activeCharacter()">
  </app-overworld-3d-view>

  <div class="status-bar">
    <span class="status-msg" *ngIf="statusMsg()">{{ statusMsg() }}</span>
    <span class="controls" *ngIf="!statusMsg()">
      <ng-container *ngIf="inShip(); else landControls">
        ⛵ <span class="ship-hint">SAILING</span> &nbsp;|&nbsp; [↑↓←→/WASD] Sail &nbsp;|&nbsp; Step onto land to disembark &nbsp;|&nbsp; [Esc] Guild
      </ng-container>
      <ng-template #landControls>
        [↑↓←→/WASD] Move &nbsp;|&nbsp; [M] World Map &nbsp;|&nbsp; [Esc] Guild &nbsp;|&nbsp; Walk to <span class="town-hint">#</span> Town &nbsp;|&nbsp; <span class="ship-hint">S</span> Ship
      </ng-template>
    </span>
  </div>
</div>
